<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Notekind Settings</title>
<link rel="stylesheet" href="app/style.css">
<style>
  body { display: block; overflow: auto; padding: 40px 20px; }
  .card { max-width: 560px; margin: 0 auto 16px; background: var(--panel);
    border: 1px solid var(--border); border-radius: 10px; padding: 16px 20px; }
  .card h2 { margin: 0 0 4px; font-size: 15px; }
  .card .dim { font-size: 12px; margin: 0 0 10px; }
  .opt { display: flex; align-items: center; gap: 8px; padding: 6px 0;
    font-size: 14px; }
  .opt select { background: var(--bg); color: var(--text);
    border: 1px solid var(--border); border-radius: 6px; padding: 3px 6px; }
  .row { display: flex; flex-wrap: wrap; gap: 8px; }
  h1 { max-width: 560px; margin: 0 auto 20px; font-size: 20px; }
  h1 .ver { color: var(--dim); font-size: 12px; font-weight: 400; }
</style>
</head>
<body>
  <h1>&#x1F4A1; Notekind <span class="ver" id="ver"></span></h1>

  <section class="card">
    <h2>General</h2>
    <p class="dim">New-tab behavior and editor appearance.</p>
    <label class="opt"><input type="checkbox" id="setNewTab">
      Open Notekind on every new tab</label>
    <label class="opt">Editor font size
      <select id="setFont">
        <option value="">default (14)</option>
        <option>12</option><option>13</option><option>15</option>
        <option>16</option><option>18</option><option>20</option>
      </select> px</label>
  </section>

  <section class="card">
    <h2>Backup</h2>
    <p class="dim">Daily zip of all notes — into <code>backups/</code> in
      your synced vault, or Downloads.</p>
    <label class="opt"><input type="checkbox" id="setBackup">
      Enable daily backup</label>
  </section>

  <section class="card">
    <h2>Vault sync</h2>
    <p class="dim">Optional — mirror every note as a real
      <code>.md</code> file in a folder you pick.</p>
    <p id="vaultStatus" class="dim">Checking…</p>
    <div class="row">
      <button id="pick">Choose vault folder</button>
      <button id="sync" class="ghost">Enable sync</button>
      <button id="import" class="ghost">Import vault → notes</button>
      <button id="export" class="ghost">Export .zip</button>
      <button id="forget" class="ghost">Forget vault</button>
    </div>
  </section>

  <script type="module" src="options.js"></script>
</body>
</html>
