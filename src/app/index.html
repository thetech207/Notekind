<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Notekind</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
  <aside id="side">
    <div id="sideHead">&#x1F4A1; Notekind</div>
    <div class="sideBtns">
      <button id="today">Today</button>
      <button id="newNote" class="ghost">+ Note</button>
    </div>
    <div id="calWrap"></div>
    <div id="tree"></div>
    <div id="vaultBar"></div>
    <details id="debug">
      <summary>Debug</summary>
      <div class="row">
        <button id="pick" class="ghost">Choose vault</button>
        <button id="sync" class="ghost">Enable sync</button>
        <button id="import" class="ghost">Import vault</button>
        <button id="export" class="ghost">Export .zip</button>
        <button id="forget" class="ghost">Forget</button>
      </div>
      <pre id="log"></pre>
    </details>
  </aside>
  <main>
    <div id="tabbar"><span id="tabs"></span><button id="newTab" title="New tab">+</button></div>
    <div id="topbar">
      <span id="notePath"></span>
      <span id="status"></span>
      <button id="prevBtn" class="ghost" title="Toggle preview (Alt+P)">Preview</button>
      <button id="quickBtn" class="ghost" title="Quick open (Alt+O / Ctrl+P)">Open…</button>
    </div>
    <textarea id="editor" spellcheck="true" placeholder="Start writing…"></textarea>
    <div id="preview" hidden></div>
    <div id="empty" hidden><div>No note open — press <b>Today</b>, pick a day on the
      calendar, or open a note (Alt+O).</div></div>
  </main>
  <div id="quick" hidden>
    <input id="qInput" placeholder="Quick open — type a note name…" autocomplete="off">
    <div id="qList"></div>
  </div>
  <script type="module" src="app.js"></script>
</body>
</html>
